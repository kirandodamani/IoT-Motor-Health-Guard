<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IoT Motor Health Guard</title><script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script><style>:root{font-family:system-ui,sans-serif;color:#eaf1f5;background:#101820}body{max-width:900px;margin:auto;padding:2rem}.settings,.card{background:#1c2933;border-radius:12px;padding:1rem;margin:1rem 0}.settings,.grid{display:grid;gap:1rem;grid-template-columns:repeat(3,1fr)}label{display:grid;gap:.3rem;color:#b7c5ce}input,button{padding:.7rem;border-radius:7px;font:inherit}input{background:#101820;color:#fff;border:1px solid #425563}button{background:#59d98e;border:0;font-weight:700}.value{font-size:2.1rem;font-weight:700}.label,#connection,#updated{color:#9eb0bc}.healthy{color:#59d98e}.alert{color:#ff6b6b}#details{white-space:pre-wrap}@media(max-width:650px){.settings,.grid{grid-template-columns:1fr}}</style></head><body><h1>IoT Motor Health Guard</h1><p id="connection">Disconnected</p><section class="settings"><label>WebSocket broker<input id="host" value="wss://broker.hivemq.com:8884/mqtt"></label><label>Topic<input id="topic" value="iot-motor-health-guard/telemetry"></label><button id="connect">Connect</button></section><section class="grid"><article class="card"><div class="label">Current</div><div class="value" id="current">—</div><div class="label">Amps RMS</div></article><article class="card"><div class="label">Vibration</div><div class="value" id="vibration">—</div><div class="label">m/s² magnitude</div></article><article class="card"><div class="label">Health status</div><div class="value" id="status">WAITING</div><div id="updated">No telemetry yet</div></article></section><section class="card"><strong>Latest message</strong><pre id="details">—</pre></section><script>let client;const $=id=>document.getElementById(id);$('connect').onclick=()=>{if(client)client.end(true);const host=$('host').value.trim(),topic=$('topic').value.trim();$('connection').textContent='Connecting…';client=mqtt.connect(host,{clientId:'motor-dashboard-'+Math.random().toString(16).slice(2)});client.on('connect',()=>{client.subscribe(topic);$('connection').textContent='Connected to '+topic});client.on('error',e=>$('connection').textContent='Connection error: '+e.message);client.on('message',(_,b)=>{try{const d=JSON.parse(b.toString()),a=d.status==='ALERT';$('current').textContent=Number(d.current_a).toFixed(2);$('vibration').textContent=Number(d.vibration_ms2).toFixed(2);$('status').textContent=d.status||'UNKNOWN';$('status').className='value '+(a?'alert':'healthy');$('updated').textContent='Updated '+new Date().toLocaleTimeString();$('details').textContent=JSON.stringify(d,null,2)}catch{$('details').textContent=b.toString()}})}</script></body></html>
